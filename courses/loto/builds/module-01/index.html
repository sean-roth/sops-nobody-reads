}
@keyframes grainShift {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-2%, -1%); }
  50% { transform: translate(1%, 2%); }
  75% { transform: translate(-1%, -2%); }

    {"question": "The six-step lockout sequence exists because:", "options": ["OSHA requires documentation of each step for compliance", "Each step addresses a different aspect of making equipment safe — skipping any one leaves a gap in protection", "The steps are a simplified version of a more complex engineering process", "Multiple steps make it harder for employees to skip the procedure entirely"], "correct": 1}

// Player JavaScript (same as AI onboarding, no modifications needed)
let currentSlide = 0;
let quizAnswers = [];
let quizMode = false;
let currentQuizQuestion = 0;
let isAnswered = false;

// Reviewer mode: view state only, in-memory for this session. NOT persisted
// (no localStorage) — this player gets packaged for SCORM/LMS delivery, and
// LMS iframe storage-partitioning makes localStorage unreliable inside an SCO.
// Never touches SCORM/LMS calls or completion/score tracking.
let reviewerMode = false;

function toggleReviewerMode() {
  reviewerMode = !reviewerMode;
  const btn = document.getElementById('modeToggleBtn');
  btn.textContent = reviewerMode ? 'Reviewer Mode' : 'Learner Mode';
  btn.setAttribute('aria-pressed', String(reviewerMode));
  renderSlide();
}

// Returns citation chip HTML, or '' if reviewer mode is off or the source
// is missing/incomplete. Fail-safe: never renders a partial or fabricated
// citation — citation and url are both required.
function renderCitation(source) {
  if (!reviewerMode || !source || !source.citation || !source.url) return '';
  return `
    <a class="citation-chip" href="${source.url}" target="_blank" rel="noopener">
      <span class="citation-chip-icon">&sect;</span>${source.citation}
    </a>
  `;
}

function initPlayer() {
  renderSlide();
  updateProgress();
  updateNavButtons();
}

function renderSlide() {
  const container = document.getElementById('slideContainer');
  
  if (quizMode) {
    renderQuiz();
    return;
  }
  
  const slide = MODULE.slides[currentSlide];
  if (!slide) return;
  
  let html = '';
  let slideClasses = `slide slide-${slide.type}`;
  
  if (slide.image) {
    slideClasses += ' has-image';
  }
  
  switch (slide.type) {
    case 'title':
      html = `
        <div class="${slideClasses}" style="${slide.image ? `background-image: url('${slide.image}')` : ''}">
          <div class="module-label">${slide.moduleLabel}</div>
          <h1>${slide.heading.replace(/\\n/g, '<br>')}</h1>
          <div class="subtitle">${slide.subtitle}</div>
          <div class="brand">${slide.brand}</div>
        </div>
      `;
      break;
      
    case 'scene':
      html = `
        <div class="${slideClasses}" style="${slide.image ? `background-image: url('${slide.image}')` : ''}">
          <div class="scene-label">${slide.label}</div>
          <p>${slide.text}</p>
        </div>
      `;
      break;
      
    case 'keypoint':
      html = `
        <div class="${slideClasses}" style="${slide.image ? `background-image: url('${slide.image}')` : ''}">
          ${slide.kicker ? `<div class="kicker">${slide.kicker}</div>` : ''}
          <h2>${slide.heading.replace(/\\n/g, '<br>')}</h2>
          <div class="body">${slide.body}</div>
        </div>
      `;
      break;
      
    case 'reveal':
      html = `
        <div class="${slideClasses}" style="${slide.image ? `background-image: url('${slide.image}')` : ''}">
          <div class="kicker">${slide.kicker}</div>
          <h2>${slide.heading.replace(/\\n/g, '<br>')}</h2>
          <div class="body">${slide.body}</div>
        </div>
      `;
      break;
      
    case 'concept':
      html = `
        <div class="${slideClasses}" style="${slide.image ? `background-image: url('${slide.image}')` : ''}">
          <div class="concept-label">${slide.label}</div>
          <div class="concept-box">
            <div class="box-text">${slide.boxText}</div>
          </div>
          <div class="body">${slide.body}</div>
        </div>
      `;
      break;
      
    case 'list':
      const listItems = slide.items.map(item => `
        <div class="list-item">
          <div class="item-num">${item.num}</div>
          <div class="item-text">${item.text}</div>
        </div>
      `).join('');
      
      html = `
        <div class="${slideClasses}" style="${slide.image ? `background-image: url('${slide.image}')` : ''}">
          <div class="list-label">${slide.label}</div>
          <h2>${slide.heading}</h2>
          <div class="list-items">
            ${listItems}
          </div>
        </div>
      `;
      break;
      
    case 'summary':
      const summaryItems = slide.items.map(item => `
        <div class="summary-item">${item}</div>
      `).join('');
      
      html = `
        <div class="${slideClasses}">
          <h2>${slide.heading}</h2>
          <div class="summary-grid">
            ${summaryItems}
          </div>
        </div>
      `;
      break;
      
    case 'options':
      const options = slide.options.map(option => `
        <div class="option ${slide.highlighted === option.letter ? 'highlighted' : ''}">
          <div class="option-letter">${option.letter}</div>
          <div class="option-content">
            <h3>${option.title}</h3>
            <p>${option.desc}</p>
          </div>
        </div>
      `).join('');
      
      html = `
        <div class="${slideClasses}" style="${slide.image ? `background-image: url('${slide.image}')` : ''}">
          <h2>${slide.heading}</h2>
          <div class="options-container">
            ${options}
          </div>
        </div>
      `;
      break;
  }

  html += renderCitation(slide.source);

  container.innerHTML = html;

  // Activate the slide
  setTimeout(() => {
    const slideEl = container.querySelector('.slide');
    if (slideEl) slideEl.classList.add('active');
  }, 50);
}

function renderQuiz() {
  const container = document.getElementById('slideContainer');
  
  if (currentQuizQuestion >= MODULE.quiz.length) {
    renderResults();
    return;
  }
  
  const question = MODULE.quiz[currentQuizQuestion];
  const options = question.options.map((option, index) => {
    const letter = String.fromCharCode(65 + index);
    let classes = 'quiz-option';
    
    if (isAnswered) {
      if (index === question.correct) {
        classes += ' correct';
      } else if (quizAnswers[currentQuizQuestion] === index) {
        classes += ' incorrect';
      }
    } else if (quizAnswers[currentQuizQuestion] === index) {
      classes += ' selected';
    }
    
    return `
      <div class="${classes}" onclick="${!isAnswered ? `selectAnswer(${index})` : ''}">
        <div class="option-letter">${letter}</div>
        <div class="option-text">${option}</div>
      </div>
    `;
  }).join('');
  
  let feedback = '';
  if (isAnswered) {
    const isCorrect = quizAnswers[currentQuizQuestion] === question.correct;
    feedback = `
      <div class="quiz-feedback">
        ${isCorrect ? 'Correct!' : 'Incorrect.'} ${getQuizFeedback(currentQuizQuestion)}
      </div>
    `;
  }
  
  let html = `
    <div class="slide slide-quiz active">
      <div class="quiz-container">
        <h2>Question ${currentQuizQuestion + 1}</h2>
        <p style="margin-bottom: 3vh; color: var(--steel-dim); font-size: clamp(1rem, 2vw, 1.3rem);">
          ${question.question}
        </p>
        <div class="quiz-options">
          ${options}
        </div>
        ${feedback}
      </div>
    </div>
  `;

  html += renderCitation(question.source);

  container.innerHTML = html;
}

function selectAnswer(answerIndex) {
  if (isAnswered) return;
  
  quizAnswers[currentQuizQuestion] = answerIndex;
  isAnswered = true;
  renderQuiz();
  updateNavButtons();
}

function getQuizFeedback(questionIndex) {
  const feedbacks = [
    "\"Off\" means the controls are in the off position. \"Safe\" means every energy source has been isolated and the isolation verified — two different things.",
    "Closing the valve stops new energy from entering. It doesn't remove the energy that was already in the line — that's stored energy.",
    "Every named source deserves a check, and stored or residual energy can outlast all of them. Checking is what step one is for.",
    "Each of the six steps closes a different gap. Skip one, and that gap stays open."
  ];
  return feedbacks[questionIndex] || '';
}

function renderResults() {
  const container = document.getElementById('slideContainer');
  const correctAnswers = quizAnswers.filter((answer, index) => answer === MODULE.quiz[index].correct).length;
  const totalQuestions = MODULE.quiz.length;
  const percentage = Math.round((correctAnswers / totalQuestions) * 100);
  const passed = percentage >= MODULE.passingScore;
  
  const html = `
    <div class="slide slide-results active">
      <div class="results-container">
        <h2>Module ${MODULE.moduleNumber} Complete</h2>
        <div class="score-display ${passed ? 'pass' : 'fail'}">
          ${percentage}%
        </div>
        <div class="results-message">
          ${correctAnswers} of ${totalQuestions} questions correct<br>
          ${passed ? 'You passed! Well done.' : `You need ${MODULE.passingScore}% to pass. Please review the material and try again.`}
        </div>
        <div class="results-actions">
          ${!passed ? `<button class="nav-btn" onclick="restartQuiz()">Try Again</button>` : ''}
          <a href="../module-02/index.html" class="nav-btn">Next Module &#8594;</a>
        </div>
        <p style="margin-top: 3vh; font-size: 0.9rem; color: var(--steel-dim);">
          Module 1 of 3 &mdash; Continue to learn the six-step LOTO procedure.
        </p>
      </div>
    </div>
  `;
  
  container.innerHTML = html;
}

function restartQuiz() {
  quizAnswers = [];
  currentQuizQuestion = 0;
  isAnswered = false;
  renderQuiz();
  updateNavButtons();
}

function nextSlide() {
  if (quizMode) {
    if (isAnswered) {
      if (currentQuizQuestion < MODULE.quiz.length - 1) {
        currentQuizQuestion++;
        isAnswered = false;
        renderQuiz();
      } else {
        renderResults();
      }
    }
  } else {
    if (currentSlide < MODULE.slides.length - 1) {
      currentSlide++;
      renderSlide();
    } else {
      // Start quiz
      quizMode = true;
      currentQuizQuestion = 0;
      isAnswered = false;
      renderQuiz();
    }
  }
  
  updateProgress();
  updateNavButtons();
}

function prevSlide() {
  if (quizMode && currentQuizQuestion === 0) {
    quizMode = false;
    currentSlide = MODULE.slides.length - 1;
    renderSlide();
  } else if (quizMode) {
    currentQuizQuestion--;
    isAnswered = quizAnswers[currentQuizQuestion] !== undefined;
    renderQuiz();
  } else if (currentSlide > 0) {
    currentSlide--;
    renderSlide();
  }
  
  updateProgress();
  updateNavButtons();
}

function updateProgress() {
  const totalSlides = MODULE.slides.length + MODULE.quiz.length;
  const currentPos = quizMode ? MODULE.slides.length + currentQuizQuestion + 1 : currentSlide + 1;
  const percentage = (currentPos / totalSlides) * 100;
  
  document.getElementById('progressFill').style.width = `${percentage}%`;
  document.getElementById('progressText').textContent = `${currentPos} / ${totalSlides}`;
}

function updateNavButtons() {
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  
  prevBtn.disabled = (!quizMode && currentSlide === 0) || (quizMode && currentQuizQuestion === 0 && currentSlide === 0);
  
  if (quizMode) {
    nextBtn.disabled = !isAnswered;
    if (currentQuizQuestion >= MODULE.quiz.length - 1 && isAnswered) {
      nextBtn.textContent = 'Results ►';
    } else {
      nextBtn.textContent = 'Next ►';
    }
  } else {
    nextBtn.disabled = false;
    if (currentSlide === MODULE.slides.length - 1) {
      nextBtn.textContent = 'Quiz ►';
    } else {
      nextBtn.textContent = 'Next ►';
    }
  }
}

// Event listeners
document.getElementById('prevBtn').addEventListener('click', prevSlide);
document.getElementById('nextBtn').addEventListener('click', nextSlide);

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && !document.getElementById('nextBtn').disabled) {
    nextSlide();
  } else if (e.key === 'ArrowLeft' && !document.getElementById('prevBtn').disabled) {
    prevSlide();
  }
});

// Initialize player
initPlayer();

// SCORM API stubs (graceful degradation)
window.API = window.API || {
  LMSInitialize: () => 'true',
  LMSCommit: () => 'true', 
  LMSFinish: () => 'true',
  LMSGetValue: () => '',
  LMSSetValue: () => 'true',
  LMSGetLastError: () => '0',
  LMSGetErrorString: () => '',
  LMSGetDiagnostic: () => ''
};
</script>
