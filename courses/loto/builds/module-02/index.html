<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2: The Six Steps | SOPs Nobody Reads</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root {
  /* Light default — sourced from sopsnobodyreads-site/styles.css */
  --bg: #f4ede0;
  --bg-panel: #ece1cd;
  --bg-panel-2: #e4d7bf;
  --ink: #1f3a2e;
  --ink-dim: #6b5d4a;
  --accent: #3a1f2e;
  --accent-wash: rgba(58, 31, 46, 0.06);
  --accent-wash-strong: rgba(58, 31, 46, 0.12);
  --rule: rgba(31, 58, 46, 0.12);
  --rule-strong: rgba(31, 58, 46, 0.22);
  --correct: #1f7a4d;
  --incorrect: #b3261e;

  /* Fixed on-image scheme — LOTO's industrial-noir imagery is dark regardless of
     chrome mode, so text over it stays on this scheme in both light and dark (§S5). */
  --onimage-ink: #f4ede0;
  --onimage-ink-dim: #d8c9a8;
  --onimage-scrim-from: rgba(10, 14, 11, 0.35);
  --onimage-scrim-to: rgba(8, 11, 9, 0.86);

  --font-display: 'Lora', Georgia, 'Times New Roman', serif;
  --font-body: 'Lora', Georgia, 'Times New Roman', serif;
  --font-ui: 'IBM Plex Sans', 'Segoe UI', sans-serif;

  --measure: 40rem;
  --page-max: 64rem;
  --gutter: 1.5rem;
}

:root.dark {
  --bg: #141f19;
  --bg-panel: #1c2b22;
  --bg-panel-2: #24362a;
  --ink: #f2ead9;
  --ink-dim: #b9ac95;
  --accent: #e0a8c4;
  --accent-wash: rgba(224, 168, 196, 0.08);
  --accent-wash-strong: rgba(224, 168, 196, 0.16);
  --rule: rgba(242, 234, 217, 0.14);
  --rule-strong: rgba(242, 234, 217, 0.24);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
}

body {
  font-family: var(--font-body);
  transition: background 0.2s ease, color 0.2s ease;
}

.player {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.slide-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4vh 8vw;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
  background: var(--bg);
  color: var(--ink);
}
.slide.active { opacity: 1; pointer-events: auto; }

.slide.has-image {
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  color: var(--onimage-ink);
}
.slide.has-image::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
  background: radial-gradient(ellipse at center, var(--onimage-scrim-from) 0%, var(--onimage-scrim-to) 100%);
}
.slide.has-image > * { position: relative; z-index: 2; }

/* ============================================================
   Register I — Source-authoritative
   ============================================================ */

/* teaching-caption — the reserved hero treatment. Only sourced truths get this. */
.slide-teaching-caption .kicker {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--accent);
  margin-bottom: 2vh;
}
.slide.has-image.slide-teaching-caption .kicker { color: var(--onimage-ink-dim); }
.slide-teaching-caption h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.9rem, 4.4vw, 3.6rem);
  line-height: 1.18;
  max-width: 32ch;
  margin-bottom: 3vh;
}
.slide-teaching-caption .body {
  font-family: var(--font-body);
  font-size: clamp(1rem, 1.7vw, 1.25rem);
  line-height: 1.55;
  color: var(--ink-dim);
  max-width: 42ch;
}
.slide.has-image.slide-teaching-caption .body { color: var(--onimage-ink-dim); }

/* definition (was concept) — sourced definition, boxed. Register-I weight, panel-delimited. */
.slide-definition .definition-label {
  font-family: var(--font-ui);
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 2.5vh;
}
.slide.has-image.slide-definition .definition-label { color: var(--onimage-ink-dim); }
.slide-definition .definition-box {
  background: var(--bg-panel);
  border: 1px solid var(--rule-strong);
  border-radius: 3px;
  padding: 2.5vh 3vw;
  margin: 0 auto 3vh;
  max-width: 42ch;
}
.slide.has-image .definition-box {
  background: rgba(20, 26, 22, 0.55);
  border-color: rgba(244, 237, 224, 0.28);
  backdrop-filter: blur(2px);
}
.slide-definition .box-text {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.1rem, 2vw, 1.55rem);
  line-height: 1.4;
  color: var(--ink);
}
.slide.has-image .box-text { color: var(--onimage-ink); }
.slide-definition .body {
  font-family: var(--font-body);
  font-size: clamp(0.92rem, 1.5vw, 1.1rem);
  line-height: 1.55;
  color: var(--ink-dim);
  max-width: 40ch;
}
.slide.has-image.slide-definition .body { color: var(--onimage-ink-dim); }

/* consolidation — folds summary + list. Order-aware structure, Register-I authority. */
.slide-consolidation h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.5rem, 3vw, 2.3rem);
  color: var(--ink);
  margin-bottom: 4vh;
  max-width: 34ch;
}
.slide-consolidation .consolidation-label {
  font-family: var(--font-ui);
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 2vh;
}
/* list-shaped consolidation (ordered, numbered) */
.slide-consolidation .consolidation-list {
  list-style: none;
  text-align: left;
  max-width: 42ch;
}
.slide-consolidation .consolidation-list .c-item {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 2.2vh;
}
.slide-consolidation .consolidation-list .c-num {
  font-family: var(--font-ui);
  font-weight: 600;
  color: var(--accent);
  min-width: 1.6rem;
}
.slide-consolidation .consolidation-list .c-text {
  font-family: var(--font-body);
  font-size: clamp(0.95rem, 1.6vw, 1.15rem);
  line-height: 1.5;
  color: var(--ink-dim);
}
.slide-consolidation .consolidation-list .c-text strong { color: var(--ink); font-weight: 600; }
/* grid-shaped consolidation (unordered review) */
.slide-consolidation .consolidation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1.4vh 2.5vw;
  max-width: 52rem;
  text-align: left;
}
.slide-consolidation .consolidation-grid .c-item {
  font-family: var(--font-body);
  font-size: clamp(0.9rem, 1.4vw, 1.05rem);
  line-height: 1.5;
  color: var(--ink-dim);
}
.slide-consolidation .consolidation-grid .c-item::before {
  content: '\2014';
  color: var(--accent);
  margin-right: 0.5em;
  font-weight: 600;
}

/* ============================================================
   Register II — Held-up-for-examination
   ============================================================ */

/* misconception-held-up — the new container. A belief the course refutes.
   Always lighter than teaching-caption; the "lighter" is bought with scale,
   quotation and containment — never with sub-AA contrast (§S2/§S4). */
.slide-misconception-held-up .misconception-frame {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-dim);
  margin-bottom: 2.5vh;
}
.slide.has-image.slide-misconception-held-up .misconception-frame { color: var(--onimage-ink-dim); }
.slide-misconception-held-up .misconception-quote {
  position: relative;
  font-family: var(--font-ui);
  font-weight: 400;
  font-style: italic;
  font-size: clamp(1.15rem, 2.4vw, 1.85rem);
  line-height: 1.4;
  color: var(--ink-dim);
  max-width: 28ch;
  padding: 0 0 0 1.2rem;
  border-left: 3px solid var(--rule-strong);
  text-align: left;
}
.slide.has-image .misconception-quote {
  color: var(--onimage-ink-dim);
  border-left-color: rgba(244, 237, 224, 0.35);
}
.slide-misconception-held-up .misconception-body {
  font-family: var(--font-body);
  font-size: clamp(0.85rem, 1.4vw, 1rem);
  line-height: 1.5;
  color: var(--ink-dim);
  max-width: 38ch;
  margin-top: 3vh;
  opacity: 0.85;
}
.slide.has-image.slide-misconception-held-up .misconception-body { color: var(--onimage-ink-dim); }

/* options — alternatives held for comparison, non-quiz. Equal weight, all below Register I. */
.slide-options h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.3rem, 2.6vw, 2rem);
  color: var(--ink);
  margin-bottom: 4vh;
  max-width: 34ch;
}
.slide.has-image.slide-options h2 { color: var(--onimage-ink); }
.options-container {
  display: flex;
  flex-direction: column;
  gap: 1.4vh;
  max-width: 42rem;
  width: 100%;
}
.option {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  background: var(--bg-panel);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 1.6vh 2vw;
  text-align: left;
}
.slide.has-image .option {
  background: rgba(20, 26, 22, 0.5);
  border-color: rgba(244, 237, 224, 0.2);
}
.option-letter {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 1rem;
  color: var(--accent);
  background: var(--bg-panel-2);
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.option-content h3 {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: clamp(0.92rem, 1.5vw, 1.05rem);
  color: var(--ink);
  margin-bottom: 0.3vh;
}
.slide.has-image .option-content h3 { color: var(--onimage-ink); }
.option-content p {
  font-family: var(--font-body);
  font-size: clamp(0.82rem, 1.3vw, 0.95rem);
  line-height: 1.4;
  color: var(--ink-dim);
}
.slide.has-image .option-content p { color: var(--onimage-ink-dim); }

/* scene — establishing / narrative beat. Image-forward, minimal low-weight text. */
.slide-scene .scene-label {
  font-family: var(--font-ui);
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-dim);
  margin-bottom: 1.5vh;
}
.slide.has-image.slide-scene .scene-label { color: var(--onimage-ink-dim); }
.slide-scene p {
  font-family: var(--font-body);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(1.05rem, 2vw, 1.55rem);
  line-height: 1.45;
  color: var(--ink-dim);
  max-width: 38ch;
}
.slide.has-image.slide-scene p { color: var(--onimage-ink); }
.slide-scene em { color: var(--accent); font-style: normal; font-weight: 600; }
.slide.has-image.slide-scene em { color: var(--onimage-ink); text-decoration: underline; text-decoration-color: rgba(244,237,224,0.5); }

/* ============================================================
   Register III — Transitional
   ============================================================ */

/* reveal — the turn. A deliberate visual break: II gives way to I. */
.slide-reveal {
  background: linear-gradient(180deg, var(--accent-wash) 0%, transparent 55%);
}
.slide.has-image.slide-reveal::after {
  content: '';
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(224,168,196,0.14) 0%, transparent 60%);
}
.slide-reveal .kicker {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--accent);
  margin-bottom: 2vh;
}
.slide.has-image.slide-reveal .kicker { color: var(--onimage-ink-dim); }
.slide-reveal h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.8rem, 4.2vw, 3.4rem);
  line-height: 1.2;
  color: var(--ink);
  max-width: 30ch;
  margin-bottom: 3vh;
}
.slide.has-image.slide-reveal h2 { color: var(--onimage-ink); }
.slide-reveal .body {
  font-family: var(--font-body);
  font-style: italic;
  font-size: clamp(1rem, 1.8vw, 1.3rem);
  line-height: 1.45;
  color: var(--accent);
  max-width: 36ch;
}
.slide.has-image.slide-reveal .body { color: var(--onimage-ink-dim); }

/* callback — connective reference. Echoes an earlier beat at reduced weight. */
.slide-callback { opacity: 0.98; }
.slide-callback .callback-label {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--ink-dim);
  opacity: 0.75;
  margin-bottom: 1.5vh;
}
.slide.has-image.slide-callback .callback-label { color: var(--onimage-ink-dim); }
.slide-callback p {
  font-family: var(--font-body);
  font-style: italic;
  font-size: clamp(0.98rem, 1.8vw, 1.35rem);
  line-height: 1.45;
  color: var(--ink-dim);
  max-width: 36ch;
  opacity: 0.92;
}
.slide.has-image.slide-callback p { color: var(--onimage-ink); }
.slide-callback em { color: var(--accent); font-style: normal; font-weight: 600; }
.slide.has-image.slide-callback em { color: var(--onimage-ink); text-decoration: underline; text-decoration-color: rgba(244,237,224,0.5); }

/* ============================================================
   Shape axis — orthogonal to register (§S3). A shape class rides
   alongside the type/register classes on the same .slide element,
   so — same rule as has-image — compound it (.slide.shape-x), never
   space it, or it silently falls back to the type's default shape.
   ============================================================ */

/* figure — a quantity leads at scale; the rest of the line is caption. */
.slide.shape-figure .figure-value {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(3.4rem, 9vw, 7.5rem);
  line-height: 1;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin-bottom: 2vh;
}
.slide.has-image.shape-figure .figure-value { color: var(--onimage-ink); }
.slide.shape-figure .figure-caption {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.3rem, 2.6vw, 2rem);
  line-height: 1.3;
  color: var(--ink);
  max-width: 26ch;
  margin-bottom: 3vh;
}
.slide.has-image.shape-figure .figure-caption { color: var(--onimage-ink); }

/* sequence — ordered steps as a visible progression, not a stacked list. */
.slide-consolidation .consolidation-sequence {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4vh 1.5vw;
  max-width: 58rem;
  width: 100%;
}
.slide-consolidation .consolidation-sequence .seq-step {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 1vh;
}
.slide-consolidation .consolidation-sequence .seq-num {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  background: var(--accent);
  color: var(--bg);
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 1.05rem;
  flex-shrink: 0;
}
.slide-consolidation .consolidation-sequence .seq-text {
  font-family: var(--font-body);
  font-size: clamp(0.85rem, 1.3vw, 1rem);
  line-height: 1.45;
  color: var(--ink-dim);
  max-width: 17ch;
}
.slide-consolidation .consolidation-sequence .seq-text strong { color: var(--ink); font-weight: 600; }
/* connector to the next step — within the same row of three, and never
   past the last item overall (§ generalized from M1: nth-child(3n) alone
   only happened to exclude M1's last item because 6 is divisible by 3;
   :not(:last-child) makes it correct for any item count, e.g. M3's 7). */
.slide-consolidation .consolidation-sequence .seq-step:not(:nth-child(3n)):not(:last-child)::after {
  content: '';
  position: absolute;
  top: 1.25rem;
  left: calc(50% + 1.55rem);
  width: calc(100% - 1.5rem);
  height: 2px;
  background: var(--rule-strong);
}
@media (max-width: 768px) {
  .slide-consolidation .consolidation-sequence { grid-template-columns: 1fr; gap: 3vh; }
  .slide-consolidation .consolidation-sequence .seq-step::after { display: none; }
}

/* stark-cut — one or two lines at large scale, little or no elaboration.
   Its cost: the reveal's usual body is de-emphasized, small and quiet,
   rather than dropped (content stays verbatim — §M1 of the brief). */
.slide.shape-stark-cut h2 {
  font-size: clamp(2.6rem, 7vw, 5.5rem);
  line-height: 1.08;
  max-width: 20ch;
  white-space: pre-line;
}
.slide.shape-stark-cut .body {
  margin-top: 4.5vh;
  font-family: var(--font-body);
  font-size: clamp(0.85rem, 1.3vw, 1rem);
  font-style: normal;
  color: var(--ink-dim);
  opacity: 0.8;
  max-width: 32ch;
}
.slide.has-image.shape-stark-cut .body { color: var(--onimage-ink-dim); opacity: 1; }

/* ============================================================
   Register IV — Frame and assessment
   ============================================================ */

.slide-title {
  background: var(--bg);
}
.slide-title .module-label {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.28em;
  color: var(--accent);
  margin-bottom: 2.5vh;
}
.slide-title h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2rem, 5vw, 4rem);
  line-height: 1.12;
  color: var(--ink);
  margin-bottom: 2vh;
  max-width: 20ch;
}
.slide-title .subtitle {
  font-family: var(--font-body);
  font-style: italic;
  font-size: clamp(0.95rem, 1.6vw, 1.25rem);
  color: var(--ink-dim);
}
.slide-title .brand {
  position: absolute;
  bottom: 4vh;
  font-family: var(--font-ui);
  font-size: 0.68rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-dim);
  opacity: 0.7;
}

.quiz-container { max-width: 42rem; width: 100%; }
.quiz-container h2 {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 2vh;
}
.quiz-question {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.15rem, 2.2vw, 1.6rem);
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 3.5vh;
}
.quiz-options { display: flex; flex-direction: column; gap: 1.2vh; margin-bottom: 2.5vh; }
.quiz-option {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  background: var(--bg-panel);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 1.5vh 2vw;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.quiz-option:hover { border-color: var(--accent); }
.quiz-option.selected { border-color: var(--accent); background: var(--accent-wash-strong); }
.quiz-option.correct { border-color: var(--correct); background: rgba(31,122,77,0.09); }
.quiz-option.incorrect { border-color: var(--incorrect); background: rgba(179,38,30,0.09); opacity: 0.75; }
.quiz-option .option-letter {
  font-family: var(--font-ui);
  font-weight: 600;
  color: var(--accent);
  background: var(--bg-panel-2);
  width: 2rem; height: 2rem;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.quiz-option.correct .option-letter { background: var(--correct); color: #fff; }
.quiz-option.incorrect .option-letter { background: var(--incorrect); color: #fff; }
.quiz-option .option-text { font-family: var(--font-body); font-size: clamp(0.9rem, 1.5vw, 1.05rem); color: var(--ink); }
.quiz-feedback {
  font-family: var(--font-body);
  font-style: italic;
  font-size: clamp(0.85rem, 1.4vw, 1rem);
  line-height: 1.5;
  color: var(--ink-dim);
  padding: 1.6vh 1.6vw;
  background: var(--bg-panel);
  border-left: 3px solid var(--accent);
  text-align: left;
}

/* close — was results. The module's resting note, equipped not merely informed. */
.close-container { max-width: 34rem; }
.close-container h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.5rem, 3vw, 2.3rem);
  color: var(--ink);
  margin-bottom: 2.5vh;
}
.close-score {
  font-family: var(--font-display);
  font-weight: 600;

   Chrome — nav, progress, buttons (identical across every course, §S4)
   ============================================================ */

.nav-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.nav-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }

.progress-section { display: flex; align-items: center; gap: 0.85rem; }

.citation-chip {

  ],
  "quiz": [
    {
      "question": "Before beginning any lockout/tagout procedure, the first thing an authorized employee should do is:",
      "options": [
        "Review the machine-specific procedure for every energy source and isolation point",
        "Place a padlock on the machine's main electrical disconnect",
        "Notify a supervisor that maintenance is starting",

      ],
      "correct": 0
    },
    {
      "question": "Three workers are performing maintenance on the same piece of equipment. How many locks should be on the energy isolation point?",
      "options": [
        "One lock — the crew lead applies it for everyone",

      ],
      "correct": 2
    },
    {
      "question": "After completing steps 1 through 5 of the lockout procedure, the authorized employee should:",
      "options": [
        "Begin the maintenance work immediately since the machine is isolated",

let currentSlide = 0;
let quizAnswers = [];
let quizMode = false;
let currentQuizQuestion = 0;
let isAnswered = false;

// Reviewer mode and dark-mode are view state only, in-memory for this session.
// NOT persisted (no localStorage/sessionStorage) — this player gets packaged
// for SCORM/LMS delivery, and LMS iframe storage-partitioning makes browser
// storage unreliable inside an SCO (§S4 delivery-safe).
let reviewerMode = false;
let darkMode = false;

function toggleReviewerMode() {
  reviewerMode = !reviewerMode;
  const btn = document.getElementById('modeToggleBtn');
  btn.textContent = reviewerMode ? 'Reviewer Mode' : 'Learner Mode';
  btn.setAttribute('aria-pressed', String(reviewerMode));
  renderCurrent();
}

function toggleDarkMode() {
  darkMode = !darkMode;
  document.documentElement.classList.toggle('dark', darkMode);
  const btn = document.getElementById('darkToggleBtn');
  btn.textContent = darkMode ? 'Light' : 'Dark';
  btn.setAttribute('aria-pressed', String(darkMode));
}

function renderCurrent() {
  if (quizMode) { renderQuiz(); } else { renderSlide(); }
}

// Citation chip (Reviewer mode). Fail-safe: never renders a partial or
// fabricated citation — citation and url are both required (Build Methodology §M3).
function renderCitation(source) {
  if (!reviewerMode || !source || !source.citation || !source.url) return '';
  return `<a class="citation-chip" href="${source.url}" target="_blank" rel="noopener"><span>&sect;</span> ${source.citation}</a>`;
}

function nl2br(s) { return (s || '').replace(/\\n/g, '<br>'); }

function initPlayer() {
  renderSlide();
  updateProgress();
  updateNavButtons();
}

function renderSlide() {
  const container = document.getElementById('slideContainer');
  const slide = MODULE.slides[currentSlide];
  if (!slide) return;

  let inner = '';
  let slideClasses = `slide slide-${slide.type}`;
  if (slide.shape) slideClasses += ` shape-${slide.shape}`;
  if (slide.image) slideClasses += ' has-image';
  const bgStyle = slide.image ? `background-image: url('${slide.image}')` : '';

  switch (slide.type) {
    case 'title':
      inner = `
        <div class="module-label">${slide.moduleLabel}</div>
        <h1>${nl2br(slide.heading)}</h1>
        <div class="subtitle">${slide.subtitle}</div>
        <div class="brand">${slide.brand}</div>
      `;
      break;

    case 'scene':
      inner = `
        <div class="scene-label">${slide.label}</div>
        <p>${slide.text}</p>
      `;
      break;

    case 'callback':
      inner = `
        <div class="callback-label">${slide.label}</div>
        <p>${slide.text}</p>
      `;
      break;

    case 'teaching-caption':
      if (slide.shape === 'figure') {
        inner = `
          ${slide.kicker ? `<div class="kicker">${slide.kicker}</div>` : ''}
          <div class="figure-value">${slide.figure}</div>
          <div class="figure-caption">${nl2br(slide.heading)}</div>
          <div class="body">${slide.body}</div>
        `;
      } else {
        inner = `
          ${slide.kicker ? `<div class="kicker">${slide.kicker}</div>` : ''}
          <h2>${nl2br(slide.heading)}</h2>
          <div class="body">${slide.body}</div>
        `;
      }
      break;

    case 'misconception-held-up':
      inner = `
        <div class="misconception-frame">${slide.kicker || 'Where people start'}</div>
        <div class="misconception-quote">&ldquo;${nl2br(slide.heading)}&rdquo;</div>
        ${slide.body ? `<div class="misconception-body">${slide.body}</div>` : ''}
      `;
      break;

    case 'reveal':
      inner = `
        <div class="kicker">${slide.kicker}</div>
        <h2>${nl2br(slide.heading)}</h2>
        <div class="body">${slide.body}</div>
      `;
      break;

    case 'definition':
      inner = `
        <div class="definition-label">${slide.label}</div>
        <div class="definition-box"><div class="box-text">${slide.boxText}</div></div>
        <div class="body">${slide.body}</div>
      `;
      break;

    case 'consolidation': {
      const isList = Array.isArray(slide.items) && slide.items.length > 0 && typeof slide.items[0] === 'object';
      const isSequence = isList && slide.shape === 'sequence';
      const body = isSequence
        ? `<ol class="consolidation-sequence">${slide.items.map(it => `
            <li class="seq-step"><span class="seq-num">${it.num}</span><span class="seq-text">${it.text}</span></li>
          `).join('')}</ol>`
        : isList
        ? `<ol class="consolidation-list">${slide.items.map(it => `
            <li class="c-item"><span class="c-num">${it.num}</span><span class="c-text">${it.text}</span></li>
          `).join('')}</ol>`
        : `<div class="consolidation-grid">${slide.items.map(it => `<div class="c-item">${it}</div>`).join('')}</div>`;
      inner = `
        ${slide.label ? `<div class="consolidation-label">${slide.label}</div>` : ''}
        <h2>${slide.heading}</h2>
        ${body}
      `;
      break;
    }

    case 'options': {
      const opts = slide.options.map(o => `
        <div class="option ${slide.highlighted === o.letter ? 'highlighted' : ''}">
          <div class="option-letter">${o.letter}</div>
          <div class="option-content"><h3>${o.title}</h3><p>${o.desc}</p></div>
        </div>
      `).join('');
      inner = `<h2>${slide.heading}</h2><div class="options-container">${opts}</div>`;
      break;
    }
  }

  inner += renderCitation(slide.source);
  container.innerHTML = `<div class="${slideClasses}" style="${bgStyle}">${inner}</div>`;
  requestAnimationFrame(() => {
    const el = container.querySelector('.slide');
    if (el) el.classList.add('active');
  });
}

function renderQuiz() {
  const container = document.getElementById('slideContainer');

  if (currentQuizQuestion >= MODULE.quiz.length) { renderClose(); return; }

  const q = MODULE.quiz[currentQuizQuestion];
  const options = q.options.map((option, index) => {
    const letter = String.fromCharCode(65 + index);
    let cls = 'quiz-option';
    if (isAnswered) {
      if (index === q.correct) cls += ' correct';
      else if (quizAnswers[currentQuizQuestion] === index) cls += ' incorrect';
    } else if (quizAnswers[currentQuizQuestion] === index) {
      cls += ' selected';
    }
    return `
      <div class="${cls}" onclick="${!isAnswered ? `selectAnswer(${index})` : ''}">
        <div class="option-letter">${letter}</div>
        <div class="option-text">${option}</div>
      </div>
    `;
  }).join('');

  let feedback = '';
  if (isAnswered) {
    const isCorrect = quizAnswers[currentQuizQuestion] === q.correct;
    feedback = `<div class="quiz-feedback">${isCorrect ? 'Correct.' : 'Incorrect.'} ${getQuizFeedback(currentQuizQuestion)}</div>`;
  }

  const html = `
    <div class="slide slide-quiz active">
      <div class="quiz-container">
        <h2>Question ${currentQuizQuestion + 1} of ${MODULE.quiz.length}</h2>
        <div class="quiz-question">${q.question}</div>
        <div class="quiz-options">${options}</div>
        ${feedback}
        ${renderCitation(q.source)}
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function selectAnswer(answerIndex) {
  if (isAnswered) return;
  quizAnswers[currentQuizQuestion] = answerIndex;
  isAnswered = true;
  renderQuiz();
  updateNavButtons();
}

function getQuizFeedback(questionIndex) {
  const feedbacks = ["Guessing which energy sources are present and where to isolate them is how people get hurt. The machine-specific procedure is the map — it comes first.","One person, one lock. Three workers means three locks, each removable only by the person who applied it.","Verification isn't trust — it's proof. Attempting to energize the equipment is the only way to confirm the lockout actually worked.","The procedure applies regardless of job duration. Short jobs are exactly where complacency is highest — the same reasoning that gets people hurt."];
  return feedbacks[questionIndex] || '';
}

// close — was "results". The module's resting note (§S3).
function renderClose() {
  const container = document.getElementById('slideContainer');
  const correctAnswers = quizAnswers.filter((a, i) => a === MODULE.quiz[i].correct).length;
  const totalQuestions = MODULE.quiz.length;
  const percentage = Math.round((correctAnswers / totalQuestions) * 100);
  const passed = percentage >= MODULE.passingScore;

  const html = `
    <div class="slide slide-close active">
      <div class="close-container">
        <h2>Module ${MODULE.moduleNumber} Complete</h2>
        <div class="close-score ${passed ? 'pass' : 'fail'}">${percentage}%</div>
        <div class="close-message">
          ${correctAnswers} of ${totalQuestions} questions correct<br>
          ${passed ? 'You passed. Well done.' : `You need ${MODULE.passingScore}% to pass. Please review the material and try again.`}
        </div>
        <div class="close-actions">
          ${!passed ? '<button class="nav-btn" onclick="restartQuiz()">Try Again</button>' : ''}
          <a href="../module-03/index.html" class="nav-btn">Next Module &#8594;</a>
        </div>
        <p class="close-note">Module 2 of 3 &mdash; Continue to Module 3: When Simple Gets Complicated.</p>
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function restartQuiz() {
  quizAnswers = [];
  currentQuizQuestion = 0;
  isAnswered = false;
  renderQuiz();
  updateNavButtons();
}

function nextSlide() {
  if (quizMode) {
    if (isAnswered) {
      if (currentQuizQuestion < MODULE.quiz.length - 1) {
        currentQuizQuestion++;
        isAnswered = false;
        renderQuiz();
      } else {
        renderClose();
      }
    }
  } else if (currentSlide < MODULE.slides.length - 1) {
    currentSlide++;
    renderSlide();
  } else {
    quizMode = true;
    currentQuizQuestion = 0;
    isAnswered = false;
    renderQuiz();
  }
  updateProgress();
  updateNavButtons();
}

function prevSlide() {
  if (quizMode && currentQuizQuestion === 0) {
    quizMode = false;
    currentSlide = MODULE.slides.length - 1;
    renderSlide();
  } else if (quizMode) {
    currentQuizQuestion--;
    isAnswered = quizAnswers[currentQuizQuestion] !== undefined;
    renderQuiz();
  } else if (currentSlide > 0) {
    currentSlide--;
    renderSlide();
  }
  updateProgress();
  updateNavButtons();
}

function updateProgress() {
  const total = MODULE.slides.length + MODULE.quiz.length;
  const pos = quizMode ? MODULE.slides.length + currentQuizQuestion + 1 : currentSlide + 1;
  document.getElementById('progressFill').style.width = `${(pos / total) * 100}%`;
  document.getElementById('progressText').textContent = `${pos} / ${total}`;
}

function updateNavButtons() {
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.disabled = !quizMode && currentSlide === 0;

  if (quizMode) {
    nextBtn.disabled = !isAnswered;
    nextBtn.textContent = (currentQuizQuestion >= MODULE.quiz.length - 1 && isAnswered) ? 'Results ►' : 'Next ►';
  } else {
    nextBtn.disabled = false;
    nextBtn.textContent = (currentSlide === MODULE.slides.length - 1) ? 'Quiz ►' : 'Next ►';
  }
}

document.getElementById('prevBtn').addEventListener('click', prevSlide);
document.getElementById('nextBtn').addEventListener('click', nextSlide);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && !document.getElementById('nextBtn').disabled) nextSlide();
  else if (e.key === 'ArrowLeft' && !document.getElementById('prevBtn').disabled) prevSlide();
});

initPlayer();

// SCORM API stubs (graceful degradation) — the player never touches SCORM/LMS
// calls or completion/score tracking beyond this; runs standalone, in an
// iframe, or as a SCORM package identically (§S4 delivery-safe).
window.API = window.API || {
  LMSInitialize: () => 'true',
  LMSCommit: () => 'true',
  LMSFinish: () => 'true',
  LMSGetValue: () => '',
  LMSSetValue: () => 'true',
  LMSGetLastError: () => '0',
  LMSGetErrorString: () => '',
  LMSGetDiagnostic: () => ''
};

</script>
</body>
